name: Test RPF6 Enhanced Lab

on:
  pull_request:
    paths:
      - 'rpf6-pocket-web/**'
      - '.github/workflows/rpf6-pocket-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'rpf6-pocket-web/**'
      - '.github/workflows/rpf6-pocket-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        working-directory: rpf6-pocket-web
        run: npm run check
      - name: Unit tests
        working-directory: rpf6-pocket-web
        run: npm test
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('rpf6-pocket-web/manifest.webmanifest', 'utf8'))"

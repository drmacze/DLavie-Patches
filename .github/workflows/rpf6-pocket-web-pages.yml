name: Deploy RPF6 Pocket Web

on:
  push:
    branches: [main]
    paths:
      - 'rpf6-pocket-web/**'
      - '.github/workflows/rpf6-pocket-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: rpf6-pocket-web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
